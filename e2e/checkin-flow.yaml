# 아발론의 현실 연고지(글래스턴베리)에서 현장 인증을 하고 스탬프와 기념 뱃지를 확인합니다.
# iOS 시뮬레이터는 실행 전에 위치 권한을 줍니다: xcrun simctl privacy booted grant location com.ryushin01.newworld
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- setLocation:
    latitude: 51.1446
    longitude: -2.7005
- extendedWaitUntil:
    visible:
      id: demo-browse
    timeout: 60000
- tapOn:
    id: demo-browse
- tapOn:
    id: tab-fantasy
- extendedWaitUntil:
    visible:
      id: world-search-fantasy
    timeout: 8000
# 아발론은 전설로 분류됩니다.
- tapOn:
    id: world-lore-legend
- tapOn:
    id: world-search-fantasy
- inputText: 아발론
# 키보드가 결과 카드를 가리므로 내립니다(iOS는 고정 글자를 누르고, Android는 키보드를 닫습니다).
- tapOn: 여행지 검색
- runFlow: _hide-keyboard-android.yaml
- extendedWaitUntil:
    visible:
      id: destination-avalon
    timeout: 8000
- tapOn:
    id: destination-avalon
- extendedWaitUntil:
    visible:
      id: destination-title
    timeout: 8000
- scrollUntilVisible:
    element:
      id: checkin-gps
    direction: DOWN
    centerElement: true
- tapOn:
    id: checkin-gps
- runFlow:
    when:
      visible: .*(허용|Allow|While using).*
    commands:
      - tapOn: .*(앱을 사용하는 동안 허용|Allow While Using App|앱 사용 중에만 허용|While using the app).*
- extendedWaitUntil:
    visible:
      id: checkin-celebration
    timeout: 20000
- assertVisible: 스탬프를 찍었어요
- assertVisible:
    id: badge-first-step
- assertVisible:
    id: badge-legend-walker
- takeScreenshot: checkin-celebration
# 축하 창에서 바로 뱃지 카드로 바꿔 보고 돌아옵니다.
- tapOn:
    id: checkin-share-badges
- extendedWaitUntil:
    visible:
      id: badge-card
    timeout: 8000
- tapOn:
    id: badge-share-close
- assertVisible: 스탬프를 찍었어요
- tapOn:
    id: checkin-passport
- extendedWaitUntil:
    visible:
      id: passport-badges-summary
    timeout: 8000
- assertVisible: 현장 인증 1 · 기념 뱃지 2/.*
- scrollUntilVisible:
    element: 아발론, 현장 인증 .*
    direction: DOWN
    timeout: 40000
- takeScreenshot: checkin-passport
# 받은 뱃지를 카드로 미리 보고 공유 창을 엽니다.
- scrollUntilVisible:
    element:
      id: passport-badge-share
    direction: UP
    timeout: 40000
- tapOn:
    id: passport-badge-share
- extendedWaitUntil:
    visible:
      id: badge-card
    timeout: 8000
- assertVisible: .*개를 모았어요
- takeScreenshot: badge-card
- tapOn:
    id: badge-share-close
- assertNotVisible:
    id: badge-card
# 지도에서 현장 인증 필터를 고르면 인증한 곳이 체크 핀으로 보입니다.
- tapOn: 뒤로 가기
- tapOn: 뒤로 가기
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      id: filter-verified
    timeout: 8000
- tapOn:
    id: filter-verified
- waitForAnimationToEnd
# 지도 마커는 Maestro가 읽지 못하므로, 인증한 아발론으로 맞춘 지도와 체크 핀은 화면으로 남깁니다.
- assertVisible:
    id: filter-verified
    selected: true
- takeScreenshot: map-verified
