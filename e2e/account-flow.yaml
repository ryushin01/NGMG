# 입력 오류 안내, 탭 이동, 둘러보기 계정 표시, 로그아웃 후 로그인 화면 복귀
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 30000
- tapOn:
    id: sign-in-submit
- assertVisible: 아이디를 입력해 주세요.
- assertVisible: 비밀번호를 입력해 주세요.
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-records
- assertVisible: 여행 기록
- assertVisible: '.*구름이 걷히던 아침.*'
- tapOn:
    id: tab-my
- assertVisible: 둘러보는 여행자, 아이디 guest
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 8000
