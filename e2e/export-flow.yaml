# 기록 CSV와 전체 JSON을 만들어 공유 화면을 엽니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: export-csv
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: export-csv
- waitForAnimationToEnd
- assertNotVisible: 내보내지 못했습니다.*
- assertNotVisible:
    id: export-csv
