# 기록에 사진 여러 장을 첨부합니다. 시뮬레이터 보관함에 사진이 있어야 합니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-places
- tapOn:
    id: place-row-p5
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: 사진 기록
- hideKeyboard
- tapOn:
    id: photo-add-library
- runFlow: _pick-photos.yaml
- extendedWaitUntil:
    visible: '.*3/10.*'
    timeout: 20000
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible:
      id: photo-0
    timeout: 90000
- assertVisible: '.*1 / 3.*'
- tapOn:
    id: photo-0
- extendedWaitUntil:
    visible:
      id: photo-viewer-close
    timeout: 8000
- tapOn:
    id: photo-viewer-close
