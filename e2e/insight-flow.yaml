# 통계, 기록 검색, 날씨 불러오기를 검사합니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-stats
- extendedWaitUntil:
    visible:
      id: stats-monthly
    timeout: 8000
- assertVisible: 자주 간 장소
- tapOn: 뒤로 가기
- tapOn:
    id: tab-records
- tapOn:
    id: records-search
- inputText: 없는검색어
- hideKeyboard
- assertVisible: 검색 결과가 없습니다.
- tapOn:
    id: tab-my
- tapOn:
    id: my-places
- extendedWaitUntil:
    visible:
      id: place-row-p5
    timeout: 8000
- tapOn:
    id: place-row-p5
- extendedWaitUntil:
    visible:
      id: place-add-record
    timeout: 8000
- tapOn:
    id: place-add-record
- scrollUntilVisible:
    element:
      id: record-load-conditions
    direction: DOWN
- tapOn:
    id: record-load-conditions
- extendedWaitUntil:
    visible: .*날씨.*
    timeout: 15000
