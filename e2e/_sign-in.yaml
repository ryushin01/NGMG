appId: com.ryushin01.newworld
tags:
  - helper
---
- extendedWaitUntil:
    visible:
      id: field-email
    timeout: 60000
- tapOn:
    id: field-email
- inputText: demo@newworld.app
- tapOn:
    id: field-password
- inputText: demo-password
- hideKeyboard
- tapOn:
    id: sign-in-submit
- runFlow:
    when:
      visible: 지금 안 함
    commands:
      - tapOn: 지금 안 함
- extendedWaitUntil:
    visible:
      id: world-search-real
    timeout: 15000
