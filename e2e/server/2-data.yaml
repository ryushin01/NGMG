# 인증을 마친 계정으로 로그인해 장소, 사진 기록, 체크리스트를 서버에 저장합니다.
appId: com.ryushin01.newworld
---
- launchApp
- extendedWaitUntil:
    visible:
      id: field-email
    timeout: 30000
- tapOn:
    id: field-email
- inputText: ${EMAIL}
- tapOn:
    id: field-password
- inputText: first-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: sign-in-submit
- runFlow: _after-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: add-place-here
    timeout: 20000
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      id: add-place-here
    timeout: 8000
- tapOn:
    id: add-place-here
- extendedWaitUntil:
    visible:
      id: map-pick-confirm
    timeout: 15000
- tapOn:
    id: map-pick-confirm
- tapOn:
    id: place-name
- inputText: 서버 유적
- tapOn: 장소 이름.*
- tapOn:
    id: place-save
- extendedWaitUntil:
    visible:
      id: place-add-record
    timeout: 20000
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: 서버 여행
- tapOn: 기본 정보
- tapOn:
    id: photo-add-library
- runFlow: ../_pick-photos.yaml
- extendedWaitUntil:
    visible: '.*3/10.*'
    timeout: 20000
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible:
      id: photo-0
    timeout: 120000
- assertVisible: '.*1 / 3.*'
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 15000
- tapOn:
    id: checklist-defaults
- extendedWaitUntil:
    visible: 24개 중 0개 챙김
    timeout: 15000
- tapOn:
    id: checklist-item-여권·비자
- assertVisible: 24개 중 1개 챙김
- waitForAnimationToEnd
