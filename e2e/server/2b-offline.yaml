# 서버가 끊기고 토큰이 만료된 상태에서 앱을 다시 켜 조회하고 저장합니다.
appId: com.ryushin01.newworld
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 30000
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible: 21개 중 1개 챙김
    timeout: 30000
- tapOn:
    id: checklist-item-유적 입장권 예약
- assertVisible: 21개 중 2개 챙김
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-places
- extendedWaitUntil:
    visible: .*서버 유적.*
    timeout: 30000
- tapOn: .*서버 유적.*
- extendedWaitUntil:
    visible:
      id: place-add-record
    timeout: 30000
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: 끊김 여행
- tapOn: 기본 정보
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible: .*끊김 여행.*
    timeout: 60000
- assertVisible:
    id: record-delete
# 끊긴 상태에서도 전에 본 사진은 기기 캐시로 보입니다.
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-records
- extendedWaitUntil:
    visible: .*서버 여행 수정.*
    timeout: 30000
- tapOn: .*서버 여행 수정.*
- extendedWaitUntil:
    visible:
      id: photo-0
    timeout: 30000
- assertNotVisible:
    id: photo-unavailable
- waitForAnimationToEnd
