# 서버가 끊긴 상태에서 로그아웃합니다.
appId: com.ryushin01.newworld
---
- runFlow: _open-drawer.yaml
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible: .*이 기기에 남고.*
    timeout: 8000
- tapOn:
    text: 로그아웃
    index: 1
- extendedWaitUntil:
    visible:
      id: field-username
    timeout: 60000
