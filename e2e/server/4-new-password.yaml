# 재설정 링크로 열린 화면에서 새 비밀번호를 저장하고 계정을 삭제합니다.
appId: com.ryushin01.ngmg
---
# simctl로 링크를 열 때만 나오는 시스템 확인 창입니다.
- runFlow:
    when:
      visible: 열기
    commands:
      - tapOn: 열기
- extendedWaitUntil:
    visible:
      id: field-password
    timeout: 20000
- tapOn:
    id: field-password
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: second-password
- tapOn:
    id: field-passwordConfirm
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: second-password
- tapOn: 변경하기
- extendedWaitUntil:
    visible:
      id: open-drawer
    timeout: 20000
- tapOn:
    id: open-drawer
- tapOn:
    id: drawer-account
- extendedWaitUntil:
    visible:
      id: delete-account
    timeout: 8000
- tapOn:
    id: delete-account
- tapOn:
    text: 계정 삭제
    index: 1
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 30000
