# 재설정 링크로 열린 화면에서 새 비밀번호를 저장하고 계정을 삭제합니다.
appId: com.ryushin01.newworld
---
# simctl로 링크를 열 때만 나오는 시스템 확인 창입니다.
- runFlow:
    when:
      visible: 열기
    commands:
      - tapOn: 열기
- extendedWaitUntil:
    visible:
      id: field-password
    timeout: 20000
- tapOn:
    id: field-password
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: second-password
- tapOn:
    id: field-passwordConfirm
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: second-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn: 변경하기
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 20000
# 이전 비밀번호는 거절되고 새 비밀번호로만 로그인됩니다.
- runFlow: _open-drawer.yaml
- extendedWaitUntil:
    visible:
      id: sign-out
    timeout: 8000
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: field-email
    timeout: 15000
- tapOn:
    id: field-email
- inputText: ${EMAIL}
- tapOn:
    id: field-password
- inputText: first-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: sign-in-submit
# 거절되면 로그인 화면에 남습니다.
- waitForAnimationToEnd
- assertVisible:
    id: sign-in-submit
- assertNotVisible:
    id: tab-my
- tapOn:
    id: field-password
- eraseText: 20
- inputText: second-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: sign-in-submit
- runFlow: _after-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 20000
- runFlow: _open-drawer.yaml
- extendedWaitUntil:
    visible:
      id: delete-account
    timeout: 8000
- tapOn:
    id: delete-account
- tapOn:
    text: 계정 삭제
    index: 1
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 30000
