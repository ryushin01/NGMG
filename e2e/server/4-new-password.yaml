# 바꾼 비밀번호로만 로그인되는지 확인하고 계정을 삭제합니다.
appId: com.ryushin01.newworld
---
# 이전 비밀번호는 거절되고 새 비밀번호로만 로그인됩니다.
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: field-username
    timeout: 15000
- tapOn:
    id: field-username
- inputText: ${ACCOUNT_ID}
- waitForAnimationToEnd
- tapOn:
    id: field-password
- inputText: first-password
- runFlow: ../_hide-keyboard-android.yaml
- waitForAnimationToEnd
- tapOn:
    id: sign-in-submit
# 거절되면 로그인 화면에 남습니다.
- waitForAnimationToEnd
- assertVisible:
    id: sign-in-submit
- assertNotVisible:
    id: tab-my
- waitForAnimationToEnd
- tapOn:
    id: field-password
- eraseText: 20
- inputText: second-password
- runFlow: ../_hide-keyboard-android.yaml
- waitForAnimationToEnd
- tapOn:
    id: sign-in-submit
- runFlow: _after-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 20000
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: delete-account
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: delete-account
- tapOn:
    text: 계정 삭제
    index: 1
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 30000
