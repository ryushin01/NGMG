# 앱을 다시 켜면 세션이 유지되고 서버 값이 보입니다.
appId: com.ryushin01.newworld
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 30000
- tapOn:
    id: tab-records
- extendedWaitUntil:
    visible: .*서버 여행 수정.*
    timeout: 20000
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible: 24개 중 2개 챙김
    timeout: 20000
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: go-forgot
    timeout: 15000
- tapOn:
    id: go-forgot
- tapOn:
    id: field-email
- inputText: ${EMAIL}
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: reset-submit
# 재설정 메일 수신은 run.sh가 확인합니다.
- waitForAnimationToEnd
