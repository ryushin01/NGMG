# 앱을 다시 켜면 세션이 유지되고 서버 값이 보입니다. 이어서 MY에서 비밀번호를 바꿉니다.
appId: com.ryushin01.newworld
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 30000
- tapOn:
    id: tab-records
- extendedWaitUntil:
    visible: .*서버 여행 수정.*
    timeout: 20000
- runFlow: _back-to-home.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible: 21개 중 2개 챙김
    timeout: 20000
- runFlow: _back-to-home.yaml
# 메일이 없으므로 로그인한 상태에서 지금 비밀번호를 확인하고 바꿉니다.
- tapOn:
    id: tab-my
- tapOn:
    id: my-password
- tapOn:
    id: field-current
- inputText: first-password
- tapOn:
    id: field-password
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: second-password
- tapOn:
    id: field-passwordConfirm
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: second-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: password-submit
- extendedWaitUntil:
    visible:
      id: my-password
    timeout: 20000
