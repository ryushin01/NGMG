appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 30000
- tapOn:
    id: go-sign-up
- tapOn:
    id: field-username
- inputText: ${USERNAME}
- waitForAnimationToEnd
- tapOn:
    id: field-password
- runFlow: _close-password-sheet.yaml
- waitForAnimationToEnd
- tapOn:
    id: field-password
- inputText: first-password
- tapOn:
    id: field-passwordConfirm
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: first-password
- tapOn:
    id: field-nickname
- inputText: 서버여행자
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: sign-up-submit
# 메일 인증 없이 가입과 동시에 로그인됩니다. 다음 단계는 로그인부터 하므로 로그아웃합니다.
- runFlow: _after-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: tab-my
    timeout: 20000
- tapOn:
    id: tab-my
- assertVisible: 서버여행자
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 15000
