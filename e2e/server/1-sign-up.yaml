appId: com.ryushin01.ngmg
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 30000
- tapOn:
    id: go-sign-up
- tapOn:
    id: field-email
- inputText: ${EMAIL}
- tapOn:
    id: field-password
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: first-password
- tapOn:
    id: field-passwordConfirm
- runFlow: _close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: first-password
- runFlow: ../_hide-keyboard-android.yaml
- tapOn:
    id: sign-up-submit
# 가입에 성공하면 로그인 화면으로 돌아갑니다. 메일 수신은 run.sh가 확인합니다.
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 20000
