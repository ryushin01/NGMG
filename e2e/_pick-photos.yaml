# 시스템 사진 선택기에서 첫 줄의 사진 3장을 고릅니다.
appId: com.ryushin01.ngmg
---
- waitForAnimationToEnd
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: '최대 10장.*'
          timeout: 20000
      - waitForAnimationToEnd
      - tapOn:
          point: '16%,27%'
      - tapOn:
          point: '50%,27%'
      - tapOn:
          point: '83%,27%'
      - tapOn:
          point: '90%,15%'
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: Recent
          timeout: 20000
      - tapOn:
          point: '16%,32%'
      - tapOn:
          point: '50%,32%'
      - tapOn:
          point: '83%,32%'
      - tapOn: Add.*
