# 프로덕션 빌드(데모 모드)의 핵심 흐름을 검사합니다.
# 로그인 → 장소 검색 → 장소 저장 → 기록 저장 → 삭제
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 8000
# 지도 시트가 올라오는 도중에는 탭이 검색창에 닿지 않습니다.
- waitForAnimationToEnd
- tapOn:
    id: home-search
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 8000
- inputText: 쿠스코
- extendedWaitUntil:
    visible:
      id: search-result-s1
    timeout: 8000
- tapOn:
    id: search-result-s1
- assertVisible: 페루 쿠스코주
- tapOn:
    id: place-save
- extendedWaitUntil:
    visible:
      id: place-title
    timeout: 8000
- assertVisible: 쿠스코
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: E2E 여행
- hideKeyboard
- scrollUntilVisible:
    element:
      id: record-highlights
    direction: DOWN
- tapOn:
    id: record-highlights
- inputText: 태양의 신전
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible:
      id: record-title
    timeout: 8000
- assertVisible: E2E 여행
- assertVisible: '.*태양의 신전.*'
# 기록 삭제 후 장소 상세로 돌아옵니다.
- scrollUntilVisible:
    element:
      id: record-delete
    direction: DOWN
- tapOn:
    id: record-delete
- tapOn: 삭제
- extendedWaitUntil:
    visible:
      id: place-title
    timeout: 8000
- assertVisible: 기록 0건
