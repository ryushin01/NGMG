# 분류 필터, 지도에서 위치 지정
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-map
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 8000
- waitForAnimationToEnd
# 분류 필터를 바꿔도 지도가 유지됩니다.
- tapOn:
    id: filter-fantasy
- tapOn:
    id: filter-all
- assertVisible: 오늘은 어디로 떠나볼까요?
- tapOn:
    id: add-place-here
- extendedWaitUntil:
    visible:
      id: map-pick-confirm
    timeout: 8000
- tapOn:
    id: map-pick-confirm
- extendedWaitUntil:
    visible:
      id: place-name
    timeout: 8000
- tapOn:
    id: place-name
- inputText: 지도에서 고른 곳
- hideKeyboard
- tapOn:
    id: kind-fantasy
- tapOn:
    id: place-save
- extendedWaitUntil:
    visible:
      id: place-title
    timeout: 8000
- assertVisible: 지도에서 고른 곳
- assertVisible: 환상 세계
