# 근처 여행지 도착 알림: 먼 곳에서 알림을 켜고 글래스턴베리(아발론 연고지)로 옮기면 알림이 오고, 누르면 상세가 열립니다.
# iOS 시뮬레이터는 실행 전에 위치 권한을 '항상'으로 줍니다: xcrun simctl privacy booted grant location-always com.ryushin01.newworld
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- setLocation:
    latitude: 37.5665
    longitude: 126.978
- extendedWaitUntil:
    visible:
      id: demo-browse
    timeout: 60000
- tapOn:
    id: demo-browse
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: arrival-alert
    direction: DOWN
- tapOn:
    id: arrival-alert
- tapOn: 계속
# 위치·알림 권한 창이 뜨면 허용합니다.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: .*(항상 허용|Always Allow|허용|Allow).*
          commands:
            - tapOn: .*(항상 허용|Change to Always Allow|Always Allow|^허용$|^Allow$).*
- extendedWaitUntil:
    visible: 근처 여행지에 도착하면 알려 드릴게요.
    timeout: 15000
- setLocation:
    latitude: 51.1446
    longitude: -2.7005
- extendedWaitUntil:
    visible: 아발론 근처에 왔어요
    timeout: 60000
- takeScreenshot: arrival-banner
- tapOn: 아발론 근처에 왔어요
- extendedWaitUntil:
    visible:
      id: destination-title
    timeout: 10000
- assertVisible: 아발론
