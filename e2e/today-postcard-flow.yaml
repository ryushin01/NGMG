# 오늘의 여행지에서 상세로 가고, 엽서를 미리 본 뒤 공유 창을 엽니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: demo-browse
    timeout: 60000
- tapOn:
    id: demo-browse
- extendedWaitUntil:
    visible:
      id: today-destination
    timeout: 15000
- tapOn:
    id: today-destination
- extendedWaitUntil:
    visible:
      id: destination-title
    timeout: 8000
- tapOn: 엽서
- extendedWaitUntil:
    visible:
      id: postcard-share
    timeout: 8000
- assertVisible: .*신세계 · .*
- tapOn:
    id: postcard-share
# 시스템 공유 창이 뜨면 엽서 이미지가 만들어진 것입니다.
- extendedWaitUntil:
    notVisible:
      id: postcard-share
    timeout: 1
    optional: true
- waitForAnimationToEnd
- takeScreenshot: share-sheet
