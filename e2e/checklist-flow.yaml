# 여행 체크리스트: 기본 목록, 체크, 항목 추가, 계정별 분리
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- tapOn:
    id: checklist-defaults
- extendedWaitUntil:
    visible: 21개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-item-여권·비자
    retryTapIfNoChange: false
- assertVisible: 21개 중 1개 챙김
- tapOn:
    id: checklist-input
- inputText: 삼각대
- tapOn:
    id: checklist-add
- assertVisible: 22개 중 1개 챙김
- hideKeyboard
- scrollUntilVisible:
    element: 삼각대
    direction: DOWN
# 모두 해제하면 항목은 남고 체크만 지워집니다.
- tapOn: 모두 해제
- tapOn: 해제
- scrollUntilVisible:
    element: 22개 중 0개 챙김
    direction: UP
- scrollUntilVisible:
    element:
      id: checklist-item-현지 통화
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: checklist-item-현지 통화
    retryTapIfNoChange: false
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 22개 중 1개 챙김
    direction: UP
# 여행별 목록: 복사하면 체크는 지워지고 원래 목록은 그대로입니다.
- scrollUntilVisible:
    element:
      id: checklist-new-list
    direction: UP
- tapOn:
    id: checklist-new-list
- tapOn:
    id: checklist-new-list-name
- inputText: 페루
- tapOn:
    id: checklist-new-list-save
- extendedWaitUntil:
    visible: 22개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-list-기본
- assertVisible: 22개 중 1개 챙김
- tapOn:
    id: checklist-list-페루
- tapOn:
    id: checklist-delete-list
- tapOn:
    text: 삭제
- extendedWaitUntil:
    visible: 22개 중 1개 챙김
    timeout: 8000
# 다시 들어와도 유지됩니다.
- tapOn: 뒤로 가기
- tapOn:
    id: tab-my
- extendedWaitUntil:
    visible: .*22개 중 1개 챙김.*
    timeout: 8000
# 다른 계정에는 보이지 않습니다.
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: field-email
    timeout: 15000
- tapOn:
    id: field-email
- inputText: other@newworld.app
- tapOn:
    id: field-password
- inputText: demo-password
- hideKeyboard
- tapOn:
    id: sign-in-submit
- runFlow:
    when:
      visible: 지금 안 함
    commands:
      - tapOn: 지금 안 함
- extendedWaitUntil:
    visible:
      id: world-search-real
    timeout: 15000
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- assertNotVisible: 삼각대
