# 여행 체크리스트: 기본 목록, 체크, 항목 추가, 계정별 분리
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- tapOn:
    id: checklist-defaults
- extendedWaitUntil:
    visible: 21개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-item-여권·비자
    retryTapIfNoChange: false
- assertVisible: 21개 중 1개 챙김
- tapOn:
    id: checklist-input
- inputText: 삼각대
- tapOn:
    id: checklist-add
- assertVisible: 22개 중 1개 챙김
- hideKeyboard
- scrollUntilVisible:
    element: 삼각대
    direction: DOWN
# 모두 해제하면 항목은 남고 체크만 지워집니다.
- tapOn: 모두 해제
- tapOn: 해제
- scrollUntilVisible:
    element: 22개 중 0개 챙김
    direction: UP
- scrollUntilVisible:
    element:
      id: checklist-item-현지 통화
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: checklist-item-현지 통화
    retryTapIfNoChange: false
- waitForAnimationToEnd
- scrollUntilVisible:
    element: 22개 중 1개 챙김
    direction: UP
# 여행별 목록: 복사하면 체크는 지워지고 원래 목록은 그대로입니다.
- scrollUntilVisible:
    element:
      id: checklist-new-list
    direction: UP
- tapOn:
    id: checklist-new-list
- tapOn:
    id: checklist-new-list-name
- inputText: 페루
- tapOn:
    id: checklist-new-list-save
- extendedWaitUntil:
    visible: 22개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-list-기본
- assertVisible: 22개 중 1개 챙김
- tapOn:
    id: checklist-list-페루
- tapOn:
    id: checklist-delete-list
- tapOn:
    text: 삭제
- extendedWaitUntil:
    visible: 22개 중 1개 챙김
    timeout: 8000
# 다시 들어와도 유지됩니다.
- tapOn: 뒤로 가기
- tapOn:
    id: tab-my
- extendedWaitUntil:
    visible: .*22개 중 1개 챙김.*
    timeout: 8000
# 다른 계정에는 보이지 않습니다.
- scrollUntilVisible:
    element:
      id: sign-out
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: sign-out
# 다른 아이디로 가입해 확인합니다.
- extendedWaitUntil:
    visible:
      id: go-sign-up
    timeout: 15000
- tapOn:
    id: go-sign-up
- tapOn:
    id: field-username
- inputText: otheruser
- tapOn:
    id: field-password
- runFlow: server/_close-password-sheet.yaml
- tapOn:
    id: field-password
- inputText: other-password
- tapOn:
    id: field-passwordConfirm
- runFlow: server/_close-password-sheet.yaml
- tapOn:
    id: field-passwordConfirm
- inputText: other-password
- tapOn:
    id: field-nickname
- inputText: 다른여행자
# 키보드가 가입 버튼을 가리므로 키보드의 다음 키로 닫은 뒤 누릅니다.
- pressKey: Enter
- runFlow: _hide-keyboard-android.yaml
- tapOn:
    id: sign-up-submit
# 가입하면 복구 코드를 한 번 보여 줍니다.
- extendedWaitUntil:
    visible:
      id: recovery-code-modal
    timeout: 15000
- assertVisible:
    id: recovery-code
    text: "[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}"
- tapOn:
    id: recovery-code-done
- runFlow:
    when:
      visible: 지금 안 함
    commands:
      - tapOn: 지금 안 함
- extendedWaitUntil:
    visible:
      id: world-search-real
    timeout: 15000
- tapOn:
    id: tab-my
- tapOn:
    id: my-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- assertNotVisible: 삼각대
