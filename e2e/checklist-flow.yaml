# 출조 체크리스트: 기본 목록, 체크, 항목 추가, 계정별 분리
appId: com.ryushin01.ngmg
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
- tapOn:
    id: open-drawer
- tapOn:
    id: drawer-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- tapOn:
    id: checklist-defaults
- extendedWaitUntil:
    visible: 24개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-item-낚싯대
- assertVisible: 24개 중 1개 챙김
- tapOn:
    id: checklist-input
- inputText: 수온계
- tapOn:
    id: checklist-add
- assertVisible: 25개 중 1개 챙김
- scrollUntilVisible:
    element: 수온계
    direction: DOWN
# 모두 해제하면 항목은 남고 체크만 지워집니다.
- tapOn: 모두 해제
- tapOn: 해제
- scrollUntilVisible:
    element: 25개 중 0개 챙김
    direction: UP
- scrollUntilVisible:
    element:
      id: checklist-item-릴
    direction: UP
- tapOn:
    id: checklist-item-릴
- scrollUntilVisible:
    element: 25개 중 1개 챙김
    direction: UP
# 출조별 목록: 복사하면 체크는 지워지고 원래 목록은 그대로입니다.
- scrollUntilVisible:
    element:
      id: checklist-new-list
    direction: UP
- tapOn:
    id: checklist-new-list
- tapOn:
    id: checklist-new-list-name
- inputText: 거문도
- tapOn:
    id: checklist-new-list-save
- extendedWaitUntil:
    visible: 25개 중 0개 챙김
    timeout: 8000
- tapOn:
    id: checklist-list-기본
- assertVisible: 25개 중 1개 챙김
- tapOn:
    id: checklist-list-거문도
- tapOn:
    id: checklist-delete-list
- tapOn:
    text: 삭제
- extendedWaitUntil:
    visible: 25개 중 1개 챙김
    timeout: 8000
# 다시 들어와도 유지됩니다.
- tapOn: 뒤로 가기
- tapOn:
    id: open-drawer
- tapOn:
    id: drawer-account
- extendedWaitUntil:
    visible: .*25개 중 1개 챙김.*
    timeout: 8000
# 다른 계정에는 보이지 않습니다.
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: field-email
    timeout: 15000
- tapOn:
    id: field-email
- inputText: other@ngmg.app
- tapOn:
    id: field-password
- inputText: demo-password
- hideKeyboard
- tapOn:
    id: sign-in-submit
- runFlow:
    when:
      visible: 지금 안 함
    commands:
      - tapOn: 지금 안 함
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 15000
- tapOn:
    id: open-drawer
- tapOn:
    id: drawer-checklist
- extendedWaitUntil:
    visible:
      id: checklist-defaults
    timeout: 8000
- assertNotVisible: 수온계
