# 끊긴 상태에서 체크와 기록을 저장하고, 연결되면 자동으로 올라가는지 검사합니다.
appId: com.ryushin01.newworld
---
- launchApp:
    clearState: true
- runFlow: _sign-in.yaml
# 온라인에서 목록을 한 번 받은 뒤 연결을 끊습니다.
- tapOn:
    id: tab-my
- extendedWaitUntil:
    visible:
      id: my-checklist
    timeout: 8000
- scrollUntilVisible:
    element:
      id: demo-offline
    direction: DOWN
    centerElement: true
- tapOn:
    id: demo-offline
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: my-places
    direction: UP
- tapOn:
    id: my-places
- extendedWaitUntil:
    visible:
      id: place-row-p5
    timeout: 8000
- tapOn:
    id: place-row-p5
- extendedWaitUntil:
    visible:
      id: place-add-record
    timeout: 8000
- tapOn:
    id: place-add-record
- tapOn:
    id: record-title
- inputText: 오프라인 여행
- hideKeyboard
# 입력 중 뒤로 가면 확인합니다.
- tapOn: 뒤로 가기
- assertVisible: 작성을 그만둘까요?
- tapOn: 계속 작성
- tapOn:
    id: record-save
- extendedWaitUntil:
    visible:
      id: record-title
    timeout: 8000
- assertVisible: 오프라인 여행
- repeat:
    while:
      notVisible:
        id: tab-my
    times: 6
    commands:
      - tapOn: 뒤로 가기
      - waitForAnimationToEnd
- tapOn:
    id: tab-real
- extendedWaitUntil:
    visible:
      id: sync-banner
    timeout: 8000
- assertVisible: .*동기화 대기 1건.*
- tapOn:
    id: sync-banner
- assertVisible: .*오프라인 여행.*
- tapOn: 뒤로 가기
# 연결을 되살리면 올라가고 기록은 그대로입니다.
- tapOn:
    id: tab-my
- scrollUntilVisible:
    element:
      id: demo-offline
    direction: DOWN
    centerElement: true
- tapOn:
    id: demo-offline
- scrollUntilVisible:
    element:
      id: my-sync
      text: .*완료.*
    direction: UP
    timeout: 10000
- assertNotVisible:
    id: sync-banner
- tapOn:
    id: tab-records
- extendedWaitUntil:
    visible: .*오프라인 여행.*
    timeout: 8000
